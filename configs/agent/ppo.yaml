# Hiperparámetros base de PPO discreto para los modelos A, B, C, D.

agent:
  ppo:
    learning_rate: 3.0e-4
    n_epochs: 4
    batch_size: 64
    rollout_steps: 2048
    clip_coef: 0.2
    gamma: 0.99
    gae_lambda: 0.95
    entropy_coef: 0.01
    value_coef: 0.5
    max_grad_norm: 0.5
    hidden_sizes: [128, 128]
